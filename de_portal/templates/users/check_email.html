{% extends "base.html" %}
{% block title %}Check Your Email - DE Portal{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card">
            <div class="card-body p-5 text-center">
                <i class="bi bi-envelope-check text-primary" style="font-size: 4rem;"></i>
                <h2 class="mt-4">Check your email</h2>
                <p class="text-muted">We sent a login link to <strong>{{ email }}</strong></p>
                <p class="small text-muted">The link expires in 30 minutes.</p>
                <a href="{% url 'login' %}" class="btn btn-outline-primary mt-3">Back to login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
