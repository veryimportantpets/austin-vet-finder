{% extends "base.html" %}
{% block title %}Messages - DE Portal{% endblock %}

{% block content %}
<h2 class="mb-4">Project Chat</h2>

<div class="card">
    <div class="card-body" style="height: 60vh; overflow-y: auto;" id="message-list">
        {% include "portal/partials/message_list.html" %}
    </div>
    <div class="card-footer">
        <form method="post" action="{% url 'post_message' thread.pk %}"
              hx-post="{% url 'post_message' thread.pk %}" hx-target="#message-list" hx-swap="innerHTML">
            {% csrf_token %}
            <div class="input-group">
                <input type="text" class="form-control" name="body" placeholder="Type a message..." required>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-send"></i> Send
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
